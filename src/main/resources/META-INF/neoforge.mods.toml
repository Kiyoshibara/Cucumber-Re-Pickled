[[mods]]

    modId="cucumber"
    version="${mod_version}"
    # logoFile="examplemod.png"
    displayURL="https://www.curseforge.com/minecraft/mc-mods/cucumber-library-re-pickled"
    credits="Original mod and code by BlakeBr0 and contributors."
    authors="BlakeBr0 (Original), Kiyoshibara (Unofficial Port)"
    displayName="Cucumber: Re-Pickled"


    logoFile="port_logo.png"
    description='''
    A shared library required by Mystical Agriculture and related mods. Unofficial NeoForge 26.3 port.
    Support this unofficial port on Patreon: https://www.patreon.com/c/Kiyoshibara
    '''
    [[mixins]]
        config="cucumber.mixins.json"

    [[dependencies.cucumber]]
        modId="neoforge"
        mandatory=true
        versionRange="[26.3.0.115,)"
        ordering="NONE"
        side="BOTH"
    [[dependencies.cucumber]]
        modId="minecraft"
        mandatory=true
        versionRange="[26.3,26.4)"
        ordering="NONE"
        side="BOTH"